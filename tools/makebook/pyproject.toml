[project]
name = "makebook"
version = "0.1.0"
description = "Genera libri .rabook (testo + audio Piper + tempi per frase) per ReadAlong"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # 1.3.0 e non oltre: le versioni successive del wheel macOS sono rotte.
    "piper-tts==1.3.0",
]

[project.scripts]
makebook = "makebook.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["makebook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: sintesi reale con Piper (salta se la voce non c'è)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Il testo è italiano: virgolette tipografiche, lineette e puntini sono voluti.
ignore = ["RUF001", "RUF002", "RUF003"]
